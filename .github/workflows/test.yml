name:
    Test Workflow
on:
    push:
        branches:
            - master

jobs:
    test_job:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Set up Node JS
              uses: actions/setup-node@v3
              with:
                  node-version: '18'
            - name: Install dependencies
              run:  npm ci
                  
            - name: Run tests
              run:  npm test